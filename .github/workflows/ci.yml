name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root & Backend Dependencies
        run: |
          cd server
          npm ci

      - name: Lint Server
        run: |
          cd server
          npm run lint --if-present

      - name: Run Server Tests
        run: |
          cd server
          npm test --if-present

      - name: Install Frontend Dependencies
        run: |
          cd client
          npm ci

      - name: Lint Client
        run: |
          cd client
          npm run lint --if-present

      - name: Build Client
        run: |
          cd client
          npm run build --if-present
